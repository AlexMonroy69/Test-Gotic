# Blueprint opcional para Render. Con "New > Blueprint" crea el servicio web
# y la base de datos Postgres automaticamente.
services:
  - type: web
    name: cripta-negra
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cripta-negra-db
          property: connectionString
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: WHATSAPP
        sync: false

databases:
  - name: cripta-negra-db
    plan: free
